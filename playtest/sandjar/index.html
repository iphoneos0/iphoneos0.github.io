<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="build" content="2784bb8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFE4D2">
<title>Sand Jar</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE4D2; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #cv { display: block; touch-action: none; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(60, 45, 30, .35); }
  .hide { display: none; }
  .card { background: #FFF9F0; border-radius: 22px; padding: 28px 26px; min-width: 240px; max-width: 86vw; text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, .18); }
  .card h2 { margin: 0 0 6px; font-size: 20px; color: #7A6550; font-weight: 600; }
  .big { font-size: 52px; font-weight: 800; color: #3B2F25; margin: 4px 0; }
  .best { font-size: 14px; color: #9A8670; margin-bottom: 18px; }
  .new { color: #E4572E; font-weight: 800; }
  button.go { font: 700 20px -apple-system, sans-serif; color: #fff; background: #E4572E; border: 0; border-radius: 16px; padding: 14px 34px; box-shadow: 0 4px 0 #B33E1C; cursor: pointer; }
  button.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #B33E1C; }
  /* 结果卡片压在底盘的位置，瓶子里的沙画整个露出来 */
  #over { align-items: flex-end; background: rgba(60, 45, 30, .08); padding-bottom: calc(var(--sab) + 12px); }
  #over .card { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 14px 10px 20px; text-align: left; border-radius: 20px; }
  #over h2 { font-size: 13px; margin: 0; }
  #over .big { font-size: 34px; margin: 0; line-height: 1.1; }
  #over .best { font-size: 13px; margin: 0; }
  #over button.go { padding: 12px 22px; font-size: 18px; white-space: nowrap; }
  #logSum { font-size: 13px; color: #5B4A3A; margin: 6px 0 10px; }
  #logTxt { width: 78vw; max-width: 520px; height: 46vh; font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="over" class="ov hide"><div class="card">
  <div><h2>The jar is full</h2>
  <div class="big" id="ovScore">0</div>
  <div class="best" id="ovBest"></div></div>
  <button class="go" id="again">Play again</button>
</div></div>
<div id="log" class="ov hide"><div class="card">
  <h2>Playtest log</h2>
  <div id="logSum"></div>
  <textarea id="logTxt" readonly></textarea><br><br>
  <button class="go" id="logCopy">Copy</button>
</div></div>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
